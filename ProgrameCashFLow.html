<!DOCTYPE html>
<html lang="en"><head><base target="_top"><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Programme Cash Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#070b14; --surface:#0f1626; --surface-2:#151e33; --surface-3:#1c2744; --border:#1f2a44; --border-strong:#2b3a5c;
  --text:#e9ebee; --text-soft:#c3cde3; --muted:#8a97b4;
  --accent:#3b82f6; --accent-strong:#2563eb; --accent-soft:rgba(59,130,246,.16); --accent-text:#7db3ff;
  --good:#4ade80; --good-bg:rgba(74,222,128,.13); --bad:#f87171; --bad-bg:rgba(248,113,113,.14); --warn:#fbbf24; --warn-bg:rgba(251,191,36,.13); --info-bg:rgba(59,130,246,.16);
  --radius:14px; --side-w:264px;
  --font-ui:'Manrope','Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
/* the tables / data boxes stay light */
.panel,.cat{--surface:#ffffff;--surface-2:#f1f4fa;--surface-3:#e9eef7;--border:#e2e8f3;--border-strong:#cdd6e6;--text:#0f1b33;--text-soft:#44516c;--muted:#7b87a0;
  --accent-soft:rgba(37,99,235,.09);--accent-text:#1d4ed8;--good:#15803d;--good-bg:#e7f6ec;--bad:#dc2626;--bad-bg:#fdecec;--warn:#b45309;--warn-bg:#fff4dc;--info-bg:#e8f0ff;
  --shadow:0 1px 2px rgba(0,0,0,.2),0 10px 30px rgba(0,0,0,.35);color:var(--text);color-scheme:light}
.panel .fld,.cat .fld,.panel select.fld{background:#fff;color:var(--text);border-color:var(--border-strong)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
html{background:var(--bg)}
body{font-family:var(--font-ui);color:var(--text);font-size:13.5px;line-height:1.4;
  background:radial-gradient(760px 520px at 100% 100%,rgba(37,99,235,.38),transparent 70%),radial-gradient(520px 380px at 0% 0%,rgba(59,130,246,.10),transparent 70%),var(--bg);background-attachment:fixed}
::selection{background:rgba(59,130,246,.35)}
*{scrollbar-width:thin;scrollbar-color:#2b3a5c transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2b3a5c;border-radius:8px}::-webkit-scrollbar-track{background:transparent}
button{font-family:var(--font-ui);border:0;border-radius:9px;color:#fff;padding:7px 12px;font-weight:700;font-size:12.5px;cursor:pointer;flex:none;transition:background .15s,border-color .15s,box-shadow .15s}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed}
.b{background:var(--accent-strong)}.b:hover{background:var(--accent)}
.g{background:#0f9f6e}.g:hover{background:#12b37c}
.r{background:#dc3b3b}.r:hover{background:#ef4a4a}
button.k{background:var(--surface);border:1px solid var(--border-strong);color:var(--text-soft)}
button.k:hover{border-color:var(--accent);color:var(--accent-text)}
button.t{background:transparent;color:var(--accent-text);padding:5px 8px}button.t:hover{background:var(--accent-soft)}
button.sm{padding:4px 9px;font-size:12px;border-radius:8px}
.ok{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.mut{color:var(--muted);font-weight:500}
/* ---------- sidebar ---------- */
#side{position:fixed;inset:0 auto 0 0;width:var(--side-w);padding:20px 14px 16px;z-index:12;display:flex;flex-direction:column;gap:6px;
  background:rgba(7,11,20,.78);backdrop-filter:blur(10px);border-right:1px solid var(--border);transition:transform .2s}
#side .brand{display:flex;align-items:center;gap:10px;padding:0 8px 16px}
#side .brand img{display:block;width:100%;height:auto;max-width:100%;object-fit:contain}
#side .brand>div{display:none}
#side .lbl{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:6px 10px 4px}
#side .pages{display:flex;flex-direction:column;gap:2px;padding-bottom:8px}
#side .pages a{display:flex;align-items:center;gap:12px;padding:6px 8px;border-radius:10px;color:var(--text-soft);text-decoration:none;font-size:13px;font-weight:700;cursor:pointer}
#side .pages a:hover{background:var(--surface-2)}
#side .pages a.on{background:var(--accent-soft);color:var(--accent-text)}
#side .pages .ic{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--surface-3);color:var(--muted)}
#side .pages a.on .ic{background:var(--accent-strong);color:#fff}
#sideNav{flex:1 1 auto;min-height:90px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
#sideNav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:6px 8px;border-radius:10px;cursor:pointer;color:var(--text-soft);font:600 13.5px/1.2 var(--font-ui)}
#sideNav button:hover{background:var(--surface-2)}
#sideNav .ic{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);font:800 11px var(--font-ui)}
#sideNav .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sideNav button.on{color:var(--accent-text);background:var(--accent-soft)}
#sideNav button.on .ic{background:var(--accent-strong);border-color:var(--accent-strong);color:#fff}
#dbar{display:flex;flex-direction:column;align-items:stretch;gap:6px;border-top:1px solid var(--border);padding-top:10px}
#dbar button{text-align:left;padding:8px 12px;font-size:12.5px}
#dbar .b{background:var(--surface);border:1px solid var(--border-strong);color:var(--text-soft)}#dbar .b:hover{border-color:var(--accent);color:var(--accent-text)}
#dbar .g{background:var(--accent-strong)}#dbar .g:hover{background:var(--accent)}
#dst{align-self:flex-start;font:800 11.5px var(--font-ui);padding:5px 11px;border-radius:999px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dst.new{background:var(--warn-bg);color:var(--warn)}#dst.ok{background:var(--good-bg);color:var(--good)}#dst.dirty{background:rgba(251,146,60,.15);color:#fb923c}
#sideToggle{display:none;position:fixed;top:12px;left:12px;z-index:13;width:40px;height:42px;border-radius:12px;padding:0;background:var(--surface);border:1px solid var(--border-strong);color:var(--text);font-size:18px;align-items:center;justify-content:center}
/* ---------- main ---------- */
#app{position:fixed;top:0;right:0;bottom:0;left:var(--side-w);display:flex;flex-direction:column;min-width:0}
#top{flex:none;padding:14px 22px 6px}
.pn{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
#pname{flex:1 1 260px;min-width:0;max-width:540px;font:800 21px var(--font-ui);color:var(--text);background:transparent;border:0;border-bottom:2px dashed transparent;padding:3px 2px;outline:none}
#pname:hover{border-bottom-color:var(--border-strong)}#pname:focus{border-bottom-color:var(--accent)}#pname::placeholder{color:#6a779a}
.sv{font-size:12px;color:var(--muted)}
.as{font-size:12px;color:var(--text-soft);display:flex;align-items:center;gap:6px;cursor:pointer}.as input{accent-color:var(--accent-strong)}
.who{font-size:12px;font-weight:700;color:var(--text-soft);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:5px 11px;cursor:pointer}.who:hover{border-color:var(--accent)}
.lockb{font-size:12px;font-weight:800;color:var(--warn);background:var(--warn-bg);border-radius:999px;padding:5px 11px;display:none}
#kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
#kpis .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px 14px 10px;box-shadow:var(--shadow);min-width:0}
#kpis .card.click{cursor:pointer}#kpis .card.click:hover{border-color:var(--accent)}
#kpis .k{font-size:12px;color:var(--muted);font-weight:700}
#kpis .v{font-size:21px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#kpis .v small{font-size:12px;font-weight:700;color:var(--muted);margin-right:3px}
#kpis .s{font-size:12px;margin-top:2px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#kpis .s.good{color:var(--good)}#kpis .s.bad{color:var(--bad)}
body.hide-sum #kpis,body.hide-sum .bsum{display:none!important}
#tzoom{position:fixed;right:22px;bottom:14px;z-index:50;display:flex;align-items:center;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow)}#tzoom button{all:unset;box-sizing:border-box;min-width:28px;text-align:center;padding:5px 8px;font:700 12px var(--font-ui);color:var(--muted);cursor:pointer;border:1px solid var(--border);border-radius:8px}#tzoom button:hover{color:var(--text);border-color:var(--accent)}#tzoom .zv{min-width:46px}
.gwrap .grid{zoom:var(--tz,1)}
#sumtog{all:unset;box-sizing:border-box;margin-left:auto;align-self:center;padding:5px 11px;margin-bottom:4px;font:700 12px var(--font-ui);color:var(--muted);cursor:pointer;border:1px solid var(--border);border-radius:8px;white-space:nowrap}#sumtog:hover{color:var(--text);border-color:var(--accent)}
#tabsbar{flex:none;display:flex;gap:4px;padding:6px 22px 0;border-bottom:1px solid var(--border);margin:6px 22px 0;padding-left:0}
.stab{all:unset;box-sizing:border-box;padding:9px 16px;font:700 13px var(--font-ui);color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px}
.stab:hover{color:var(--text)}.stab.on{color:var(--accent-text);border-bottom-color:var(--accent-strong)}
.stab .bd{min-width:18px;padding:0 6px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;text-align:center;line-height:17px}
#sheets{flex:1;min-height:0;position:relative}
.sheet{position:absolute;inset:0;display:none;flex-direction:column;padding:14px 22px 22px;overflow:auto}.sheet.on{display:flex}
.tool{flex:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 0 12px}
.tool .sp{flex:1}.tool .info{font-size:12px;color:var(--muted)}
.tool input,.tool select,.fld,.dlg-input{height:34px;padding:0 11px;border:1px solid var(--border-strong);border-radius:9px;background:#0a1020;color:var(--text);font:600 13px var(--font-ui)}
.tool input:focus,.tool select:focus,.fld:focus,.dlg-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tool .ck{font-size:12.5px;color:var(--text-soft);display:flex;gap:6px;align-items:center;cursor:pointer}.tool .ck input{height:auto;accent-color:var(--accent-strong)}
/* ---------- cards / lists ---------- */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel>h4{margin:0;padding:14px 16px 4px;font-size:14px;font-weight:800}.panel>.sub{padding:0 16px 8px;color:var(--muted);font-size:12px}
.lst{width:100%;border-collapse:collapse}
.lst th{position:sticky;top:0;background:var(--surface);z-index:2;text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:11px 12px;border-bottom:1px solid var(--border)}
.lst td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.lst tbody tr:last-child td{border-bottom:0}
.lst tbody tr.row{cursor:pointer}.lst tbody tr.row:hover td{background:#f4f7fc}
.lst .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.lst tr.void td{opacity:.5}.lst tr.void .de{text-decoration:line-through}
.lst tr.tot td{background:var(--surface-2);font-weight:800}
.lst tr.sub td{background:#f8fafd;font-weight:700}
#dmod .lst th{background:var(--surface)}
.de{font-weight:700}.de small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:1px}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap;margin:1px 3px 1px 0}
.chip.in{background:var(--good-bg);color:var(--good)}.chip.ex{background:var(--bad-bg);color:var(--bad)}.chip.tr{background:var(--info-bg);color:var(--accent-text)}.chip.rt{background:var(--warn-bg);color:var(--warn)}
.chip.fl{background:var(--warn-bg);color:var(--warn)}.chip.fb{background:var(--bad-bg);color:var(--bad)}.chip.gd{background:var(--good-bg);color:var(--good)}.chip.nt{background:var(--surface-3);color:var(--text-soft)}
.amt-in{color:var(--good);font-weight:800}.amt-out{color:var(--bad);font-weight:800}.amt-tr{color:var(--accent-text);font-weight:800}
.empty{padding:34px;color:var(--muted);text-align:center}
.acts{white-space:nowrap;text-align:right}
/* ---------- budget ---------- */
.bsum{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:14px}
.bsum .c{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px 14px;box-shadow:var(--shadow)}
.bsum .c .k{font-size:12px;color:var(--muted);font-weight:700}.bsum .c .v{font-size:19px;font-weight:800;margin-top:1px}.bsum .c .s{font-size:12px;color:var(--muted)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(640px,1fr));gap:14px;align-items:start}
.cat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.cat.over{border-color:#f3b4b4}
.ch{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#fbfcff,#f5f8fd)}
.ch input.cn{flex:1;min-width:0;font:800 15px var(--font-ui);color:var(--text);background:transparent;border:1px solid transparent;border-radius:8px;padding:4px 7px}
.ch input.cn:hover{border-color:var(--border-strong)}.ch input.cn:focus{outline:none;background:#fff;border-color:var(--accent)}
.cfig{display:flex;gap:14px;font-size:12px;color:var(--muted);font-weight:700}.cfig b{display:block;font-size:13.5px;color:var(--text);font-variant-numeric:tabular-nums}
.itbl{width:100%;border-collapse:collapse}
.itbl th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800;text-align:right;padding:8px 8px 6px}
.itbl th:first-child{text-align:left;padding-left:14px}
.itbl td{padding:3px 8px;border-top:1px solid #eef1f7;vertical-align:middle;text-align:right;font-variant-numeric:tabular-nums}
.itbl td:first-child{text-align:left;padding-left:10px}
.itbl input{width:100%;font:600 13px var(--font-ui);color:var(--text);background:transparent;border:1px solid transparent;border-radius:7px;padding:6px 7px;text-align:inherit}
.itbl input:hover{border-color:var(--border-strong)}.itbl input:focus{outline:none;background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.itbl input[readonly]{color:var(--text-soft);cursor:default}.itbl input[readonly]:hover,.itbl input[readonly]:focus{border-color:transparent;box-shadow:none;background:transparent}
.itbl .sm2{display:block;font-size:11px;color:var(--muted);font-weight:600;text-align:left;margin:-2px 0 3px 8px}
.itbl tr.why td{border-top:0;padding:0 14px 8px 14px;text-align:left}
.itbl tr.why input{background:#fff7f7;border:1px solid #f3c9c9;color:#8f1d1d}
.cf{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--border);background:#fafbfe}
.cf .addit{border:1.5px dashed var(--accent);background:var(--accent-soft);color:var(--accent-text);padding:7px 14px}
.cf .addit:hover{background:rgba(37,99,235,.16)}
.cf .sp{flex:1}.cf .note{font-size:12px;color:var(--muted)}
.cm{padding:8px 14px;border-top:1px solid var(--border);font-size:12.5px}
.cm .r1{display:flex;gap:10px;align-items:center;padding:3px 0}.cm .r1 span{flex:1}
.fund{margin-bottom:14px}.fund .lst td{padding:7px 12px}
.fund input,.fund select{height:30px;width:100%;border:1px solid transparent;border-radius:7px;background:transparent;font:600 13px var(--font-ui);padding:0 6px;color:var(--text)}
.fund input:hover,.fund select:hover{border-color:var(--border-strong)}.fund input:focus,.fund select:focus{outline:none;border-color:var(--accent);background:#fff}
/* ---------- people / summary ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px;align-items:start;margin-bottom:14px}
.chk{display:flex;align-items:center;gap:10px;padding:9px 16px;border-top:1px solid var(--border)}
.chk .ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--good-bg);color:var(--good)}
.chk.bad .ic{background:var(--warn-bg);color:var(--warn)}.chk .tx{flex:1}.chk .tx small{display:block;color:var(--muted)}
.setg{display:flex;gap:18px;flex-wrap:wrap;padding:6px 16px 16px;align-items:center}.setg label{font-size:12.5px;color:var(--text-soft);font-weight:700;display:flex;gap:8px;align-items:center}.setg input{width:90px}
/* ---------- dialogs ---------- */
#dmod{position:fixed;inset:0;background:rgba(3,6,12,.7);backdrop-filter:blur(3px);z-index:100000;display:flex;align-items:center;justify-content:center;font-family:var(--font-ui)}
#dmod .box{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:16px;width:min(560px,94vw);max-height:90vh;overflow:auto;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.6)}
#dmod .box.wide{width:min(720px,95vw)}
#dmod h3{margin:0 0 12px;font-size:17px;font-weight:800}#dmod .mb{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
#dmod .row{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--border)}#dmod .row span{flex:1;font-size:14px}#dmod .row small{display:block;color:var(--muted)}
#dmod input.dlg-input,#dmod textarea{width:100%;margin-bottom:4px}
.dlg-text{color:var(--text-soft);font-size:13px;margin:0 0 10px}
.seg{display:flex;background:var(--surface-3);border-radius:10px;padding:3px;gap:2px;margin-bottom:12px}
.seg button{flex:1;background:transparent;color:var(--text-soft);padding:7px 6px;border-radius:8px}
.seg button.on{background:var(--accent-strong);color:#fff}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}.frm .full{grid-column:1/-1}
.frm label{font-size:11.5px;font-weight:800;color:var(--text-soft);display:block;margin-bottom:3px}.frm label i{color:var(--bad);font-style:normal}
.frm .fld,.frm select,.frm textarea{width:100%;height:36px}
.frm textarea{height:auto;padding:8px 11px;font:600 13px var(--font-ui);border:1px solid var(--border-strong);border-radius:9px}
.hint{font-size:12px;color:var(--muted);margin-top:3px}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:12.5px;margin-top:10px;font-weight:600}
.errbox{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:9px 12px;font-size:12.5px;margin-top:10px;font-weight:700}
#dtoast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--accent);color:var(--text);padding:9px 18px;border-radius:22px;font:600 13px var(--font-ui);z-index:100001;display:none;box-shadow:0 10px 30px rgba(15,27,51,.35)}
@media (max-width:1000px){
  #app{left:0}#side{transform:translateX(-100%)}body.side-open #side{transform:none;box-shadow:12px 0 40px rgba(0,0,0,.6)}
  #sideToggle{display:flex}body.side-open #sideToggle{left:calc(var(--side-w) + 10px)}
  #top{padding:60px 14px 4px}#kpis{display:flex;overflow-x:auto;gap:8px}#kpis .card{flex:0 0 150px}
  .sheet{padding:12px 14px 20px}#tabsbar{overflow-x:auto;margin:6px 14px 0}.stab{flex:none}
  .bsum{grid-template-columns:repeat(2,minmax(0,1fr))}.cats{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}
  .lst-wrap{overflow-x:auto}.frm{grid-template-columns:1fr}
}
@media print{#tzoom,#side,#sideToggle,#top,.tool,#tabsbar,.acts,.cf,#dtoast{display:none!important}#app{position:static}html,body{overflow:visible;height:auto}.sheet{position:static;display:block!important;overflow:visible}.sheet:not(.on){display:none!important}}
.itbl input.q::placeholder{color:#a3aec4;font-weight:500}

@media print{body{background:#fff!important;color:#000}}

/* ---------- editable grids (Transactions + Budget) ---------- */
#sh-tx,#sh-bt{overflow:hidden}
#btw{display:flex;flex-direction:column;flex:1;min-height:0}
.gwrap{flex:1;min-height:0;overflow:auto;position:relative}
#btw .gwrap{margin-top:0}
table.grid{border-collapse:separate;border-spacing:0;table-layout:fixed;font:13px/1.25 var(--font-ui)}

<script>
(function(){
var ON=!!(window.google&&google.script&&google.script.run),S,cur={id:null,name:'',dirty:false,status:'draft',updated:0},mem={};
var XK='cashflow',XL='cash flow',XAPP='murc-programme-app',XR0='display:flex;gap:8px;flex-wrap:wrap',XR1='display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:12px';
var TYPES=['Income','Expense','Transfer','Return'],TYX=['Income','Expense','Expense (UIA operator)','Transfer','Return'],UIA='Expense (UIA operator)',TKS=[['Honorarium','Honorarium'],['ROF','Refreshment Order Form (ROF)'],['PO','Purchase Order (PO)']],PMS=['Cash','Bank transfer','Card','E-wallet'],SRCS=['Advance','Sponsorship','Fees','Opening float','Other'],CLS=['pending','approved','paid'];

/* ---- data model ----------------------------------------------------------

 Transfers are ONE record (from account -> to account), so both sides always agree. */
function blankItem(){return{u:uid(),item:'',price:'',qty:'',qt:'',why:'',old:null,mt:0}}

/* ---- old (v2) files -> v3 ---- */
function oldEmpty(t){return!(t.id||t.co||t.ac||t.in||t.out||t.de||t.tf||t.ca)}
function migTx(rows,cats){
 var out=[],legs=[],catBy={};cats.forEach(function(c){if(low(c.name))catBy[low(c.name)]=c});
 rows.forEach(function(r){if(oldEmpty(r))return;
  var inn=Math.abs(num(r.in)),o=Math.abs(num(r.out)),t=newTx();
  t.d=pd(r.d);t.co=String(r.co||'').trim();t.ac=String(r.ac||'').trim();t.de=String(r.de||'');t.tf=String(r.tf||'');t.cb=r.cb||'imported';t.ct=Date.now();
  if(r.ty==='Income'){t.ty='Income';t.amt=rn(inn-o);t.sr='Other';out.push(t)}

   if(r.ty==='Expense'){var ca=String(r.ca||'').trim(),c=catBy[low(ca)];if(c)t.cu=c.u;else if(ca){t.cn=ca;t.ob=1;t.why='Imported: category not in the budget'}}
   out.push(t)}
  else{t.ty='Transfer';out.push(t);legs.push({t:t,inn:inn,o:o,id:low(r.id)})}});
 var by={};legs.forEach(function(l){if(l.id){(by[l.id]=by[l.id]||[]).push(l)}});

   for(var i=0;i<g.length;i++){var b=g[i];if(b===a||b.done||!(b.inn>0)||Math.abs(b.inn-a.o)>0.005)continue;

 return out.filter(function(t){return!t.drop})}

 (o.cats||[]).forEach(function(c){var k=blankCat();k.name=String(c.name||'');
