<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programme app</title>
<style>
:root{--bg:#070b14;--surface:#0f1626;--surface-2:#151e33;--border:#1f2a44;--border-strong:#2b3a5c;--text:#e9ebee;--text-soft:#c3cde3;--muted:#8a97b4;--accent:#3b82f6;--accent-strong:#2563eb;--accent-soft:rgba(59,130,246,.16);--accent-text:#7db3ff;--menu-w:224px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;touch-action:pan-x pan-y;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
@supports (height:100dvh){html,body{height:100dvh}}
/* ---- static left menu (never re-renders, never scrolls away) ---- */
#menu{flex:none;width:var(--menu-w);height:100%;background:var(--surface);border-right:1px solid var(--border);padding:22px 14px 16px;display:flex;flex-direction:column;gap:4px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand img{width:40px;height:40px;object-fit:contain;flex:none}
.brand b{display:block;font-size:17px;line-height:1.1;color:#fff;letter-spacing:.01em}
.brand small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px}
.mi{display:flex;align-items:center;gap:12px;width:100%;padding:6px 8px;border:0;border-radius:10px;background:none;color:var(--text-soft);font-weight:600;font-size:13px;line-height:1.2;font-family:inherit;text-align:left;cursor:pointer}
.mi:hover{background:var(--surface-2)}
.mi.on{background:var(--accent-soft);color:var(--accent-text)}
.mi .ic{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--surface-2);color:var(--muted)}
.mi.on .ic{background:var(--accent-strong);color:#fff}
.mi.new .ic{background:var(--accent-soft);color:var(--accent-text)}
#foot{margin-top:auto;padding:10px;font-size:11px;color:var(--muted)}
/* ---- tabs + content ---- */
#main{flex:1;min-width:0;height:100%;display:flex;flex-direction:column}
#bar{flex:none;height:42px;display:flex;align-items:flex-end;gap:6px;padding:6px 10px 0;background:var(--bg);border-bottom:1px solid var(--border)}
#mtog{display:none;align-self:center;width:34px;height:30px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface-2);color:var(--text);font-size:16px;cursor:pointer}
#tabs{flex:1;min-width:0;display:flex;align-items:flex-end;gap:3px;overflow-x:auto;scrollbar-width:thin}
.tab{flex:none;display:flex;align-items:center;gap:8px;max-width:240px;height:35px;padding:0 8px 0 12px;border:1px solid var(--border);border-bottom:0;border-radius:10px 10px 0 0;background:var(--surface);color:var(--muted);cursor:pointer;user-select:none}
.tab:hover{background:var(--surface-2);color:var(--text-soft)}
.tab.on{background:var(--surface-2);color:#fff;border-color:var(--border-strong);box-shadow:inset 0 2px 0 var(--accent)}
.tab .k{flex:none;width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:800;background:var(--accent-soft);color:var(--accent-text)}
.tab .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;font-weight:600}
.tab .d{display:none;flex:none;width:7px;height:7px;border-radius:50%;background:#f59e0b}
.tab.dirty .d{display:block}
.tab .x{flex:none;width:20px;height:20px;border:0;border-radius:6px;background:none;color:inherit;font-size:15px;line-height:1;cursor:pointer}
.tab .x:hover{background:rgba(255,255,255,.12);color:#fff}
#frames{flex:1;position:relative;min-height:0}
#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
#frames iframe.on{display:block}
#msg{position:absolute;inset:0;display:none;place-items:center;color:var(--muted);pointer-events:none}
#scrim{display:none}
@media (max-width:760px){
  #menu{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);transition:transform .18s}
  body.menu-open #menu{transform:none;box-shadow:12px 0 40px rgba(0,0,0,.6)}
  body.menu-open #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
  #mtog{display:block}
}
</style>
</head>

var ON=!!(window.google&&google.script&&google.script.run);
var KIND={
  proposal:{page:'Proposal',ic:'P',blank:'New proposal'},
  finreport:{page:'Financial',ic:'F',blank:'New financial report'},
  cashflow:{page:'ProgrameCashFLow',ic:'C',blank:'New cash flow'}
};
var tabs=[],cur=null,seq=0,cache={},fr=document.getElementById('frames'),bar=document.getElementById('tabs');
var INJ='<script>window.google=window.parent.google;<\/script><style>#side>.brand,#side>.brand+.lbl,#side>.pages{display:none!important}</style>';

function clean(s){return String(s||'').replace(/[^\w-]/g,'');}
function getHtml(name){
  if(cache[name])return Promise.resolve(cache[name]);
  return new Promise(function(ok,no){
    if(!ON){no(new Error('Open this app from its web app link to load the pages.'));return;}
    google.script.run.withSuccessHandler(function(h){cache[name]=h;ok(h);}).withFailureHandler(no).getPageHtml(name);
  });
}
function prep(h,draft){
  h=h.replace('<base target="_top">','<base target="_blank">');
  h=h.replace(/<head>/i,function(){return '<head>'+INJ;});
  if(draft)h=h.replace('window.__DRAFT_ID__=null;','window.__DRAFT_ID__='+JSON.stringify(draft)+';');
  return h;
}
function win(t){try{return t.fr.contentWindow;}catch(e){return null;}}

function label(t){
  t.btn.querySelector('.t').textContent=t.title;t.btn.title=t.title;
  t.btn.classList.toggle('dirty',!!t.dirty);
}
function mk(o){
  var t={id:'t'+(++seq),page:o.page,kind:o.kind||null,draft:o.draft||null,title:o.title,pinned:!!o.pinned,dirty:false,ready:false,closed:false,at:0};
  t.fr=document.createElement('iframe');t.fr.title=o.title;fr.appendChild(t.fr);
  var b=document.createElement('div');b.className='tab';b.setAttribute('role','tab');
  b.innerHTML='<span class="k"></span><span class="t"></span><span class="d" title="Unsaved changes"></span>'+(t.pinned?'':'<button class="x" type="button" aria-label="Close tab" title="Close tab">&times;</button>');
  b.querySelector('.k').textContent=o.ic;
  b.onclick=function(e){if(e.target.closest&&e.target.closest('.x'))close(t);else activate(t);};
  b.onauxclick=function(e){if(e.button===1&&!t.pinned){e.preventDefault();close(t);}};
  bar.appendChild(b);t.btn=b;tabs.push(t);label(t);activate(t);
  getHtml(t.page).then(function(h){
    if(t.closed)return;
    t.fr.onload=function(){t.ready=true;t.at=Date.now();if(o.after)o.after(t);};
    t.fr.srcdoc=prep(h,t.draft);
  }).catch(function(e){
    if(t.closed)return;t.title='Could not load';label(t);
    var d=t.fr.contentDocument;if(d){d.body.style.cssText='font:14px system-ui;color:#c3cde3;background:#070b14;padding:24px';d.body.textContent=(e&&e.message)||String(e);}
  });
  return t;
}
function activate(t){
  cur=t;
  tabs.forEach(function(x){var on=x===t;x.fr.classList.toggle('on',on);x.btn.classList.toggle('on',on);});
  document.getElementById('mDash').classList.toggle('on',t.pinned);
  if(t.btn.scrollIntoView)t.btn.scrollIntoView({block:'nearest',inline:'nearest'});
  document.body.classList.remove('menu-open');
  /* the Dashboard list can be stale after saving in another tab: refresh it when you come back to it */
  if(t.pinned&&t.ready&&Date.now()-t.at>2000){var w=win(t);try{w.document.getElementById('refresh').click();t.at=Date.now();}catch(e){}}
}
function close(t){
  if(t.pinned||t.closed)return;
  var w=win(t),needAsk=t.dirty&&(t.kind==='finreport'||t.kind==='cashflow'||!t.draft);
  if(needAsk&&!confirm('\u201c'+t.title+'\u201d has unsaved changes. Close it anyway?'))return;
  /* a saved proposal of yours is auto-saved on close (the page does this on pagehide) */
  if(t.dirty&&t.kind==='proposal'&&t.draft&&w){try{w.dispatchEvent(new w.Event('pagehide'));}catch(e){}}
  t.closed=true;
  var i=tabs.indexOf(t);tabs.splice(i,1);t.btn.remove();
  var f=t.fr;setTimeout(function(){f.remove();},t.dirty?2500:0);f.classList.remove('on');
  if(cur===t)activate(tabs[Math.max(0,i-1)]);
}

/* ---- API the pages call: window.parent.TABS ---- */
window.TABS={
  newTab:function(kind){var k=KIND[kind]||KIND.proposal;return mk({page:k.page,kind:kind,title:k.blank,ic:k.ic});},
  openDraft:function(kind,id){
    id=clean(id);if(!id)return null;
    var ex=tabs.filter(function(t){return t.draft===id;})[0];
    if(ex){activate(ex);return ex;}
    var k=KIND[kind]||KIND.proposal;
    return mk({page:k.page,kind:kind,draft:id,title:'Opening\u2026',ic:k.ic});
  },
  prefill:function(kind,o){
    var k=KIND[kind]||KIND.proposal;
    return mk({page:k.page,kind:kind,title:k.blank,ic:k.ic,after:function(t){
      var n=0,iv=setInterval(function(){var w=win(t);n++;
        if(w&&w.__prefill){clearInterval(iv);setTimeout(function(){try{w.__prefill(o);}catch(e){}},800);}
        else if(n>40)clearInterval(iv);},150);
    }});
  },
  status:function(id,s){tabs.forEach(function(t){var w=win(t);if(t.draft===id&&w&&w.__setStatus){try{w.__setStatus(id,s);}catch(e){}}});},
  deleted:function(id){tabs.forEach(function(t){var w=win(t);if(t.draft===id&&w&&w.__deleted){try{w.__deleted(id);}catch(e){}t.draft=null;}});}
};

/* keep tab titles / unsaved dots in step with the documents */
setInterval(function(){
  tabs.forEach(function(t){
    if(t.pinned||!t.ready)return;var w=win(t);if(!w||!w.__st)return;
    try{
      var s=w.__st(),k=KIND[t.kind]||{},ttl=s.name||k.blank||t.title;
      t.draft=s.id||null;
      if(ttl!==t.title||!!s.dirty!==t.dirty){t.title=ttl;t.dirty=!!s.dirty;label(t);}
    }catch(e){}
  });
},1200);

/* leaving the whole app with unsaved work */
window.addEventListener('beforeunload',function(e){
  if(tabs.some(function(t){return t.dirty;})){e.preventDefault();e.returnValue='';}
});

/* ---- menu ---- */
document.getElementById('mDash').onclick=function(){activate(tabs[0]);};
document.getElementById('mProp').onclick=function(){TABS.newTab('proposal');};
document.getElementById('mFin').onclick=function(){TABS.newTab('finreport');};
document.getElementById('mCash').onclick=function(){TABS.newTab('cashflow');};
document.getElementById('mtog').onclick=function(){document.body.classList.toggle('menu-open');};
document.getElementById('scrim').onclick=function(){document.body.classList.remove('menu-open');};

/* ---- start: Dashboard (pinned) + whatever the link asked for ---- */
var dash=mk({page:'Dashboard',title:'Dashboard',ic:'D',pinned:true});
if(BOOT.draft)TABS.openDraft(BOOT.page==='Financial'?'finreport':BOOT.page==='ProgrameCashFLow'?'cashflow':'proposal',BOOT.draft);
else if(BOOT.page==='Proposal')TABS.newTab('proposal');
else if(BOOT.page==='Financial')TABS.newTab('finreport');
else if(BOOT.page==='ProgrameCashFLow')TABS.newTab('cashflow');
})();
</script>
</body>
</html>
