<!-- Zoom.html - added to the Proposal and Financial pages by getPageHtml(). Fits the A4 page to a phone screen,
     and adds pinch-to-zoom plus  - / + / Fit  buttons. -->
<style>
html,body{touch-action:pan-x pan-y}
#zc{position:fixed;right:12px;bottom:14px;z-index:60;display:flex;align-items:center;gap:2px;padding:4px;border-radius:12px;
  background:rgba(15,22,38,.94);border:1px solid #2b3a5c;box-shadow:0 6px 20px rgba(0,0,0,.45);color:#e9ebee;font:600 13px system-ui,Arial,sans-serif}
#zc button{min-width:38px;height:36px;border:0;border-radius:8px;background:transparent;color:inherit;font:inherit;font-size:18px;cursor:pointer}
#zc button:active{background:#2563eb}
#zc button.fit{font-size:12px;padding:0 10px}
#zc span{min-width:46px;text-align:center;font-size:12px;color:#c3cde3}
@media print{#zc{display:none!important}}
</style>
<div id="zc" class="no-print" aria-label="Zoom"><button type="button" data-z="out" aria-label="Zoom out">&minus;</button><span id="zv">100%</span><button type="button" data-z="in" aria-label="Zoom in">+</button><button type="button" class="fit" data-z="fit" title="Fit page to screen width">Fit</button></div>
<script>
(function(){
var host=document.getElementById('doc')||document.getElementById('pages');
if(!host)return;
var PAGE=794,MIN=.25,MAX=3,z=1,user=false,sc=document.scrollingElement||document.documentElement,
    lbl=document.getElementById('zv'),sel=document.getElementById('zoom');
function avail(){var cs=getComputedStyle(document.body);return window.innerWidth-(parseFloat(cs.paddingLeft)||0)-(parseFloat(cs.paddingRight)||0);}
function fitZ(){return Math.max(MIN,Math.min(1,(avail()-4)/PAGE));}
function show(){
  lbl.textContent=Math.round(z*100)+'%';
  if(sel){var v=String(Math.round(z*100)),o=[].filter.call(sel.options,function(x){return x.value===v;})[0];
    if(!o){o=sel.querySelector('option[data-c]')||document.createElement('option');o.setAttribute('data-c','1');o.value=v;o.textContent=v+'%';sel.appendChild(o);}
    sel.value=v;}
}
function set(n,focusX){
  n=Math.max(MIN,Math.min(MAX,n));if(Math.abs(n-z)<.001)return;
  var r=n/z,x=focusX==null?window.innerWidth/2:focusX,y=window.innerHeight/2;
  z=n;host.style.zoom=z;
  sc.scrollLeft=(sc.scrollLeft+x)*r-x;
  show();
}
function setUser(n,fx){user=true;set(n,fx);}
function fit(){user=false;var n=fitZ();z=0;set(n);sc.scrollLeft=0;}
document.getElementById('zc').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;var k=b.getAttribute('data-z');
  if(k==='in')setUser(z*1.2);else if(k==='out')setUser(z/1.2);else fit();
});
if(sel)sel.addEventListener('change',function(){user=true;var n=(+sel.value)/100;if(n>0){z=n;lbl.textContent=Math.round(z*100)+'%';}});
/* pinch with two fingers, zooming around the point between them */
var d0=0,z0=1,cx=0;
function dist(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);}
document.addEventListener('touchstart',function(e){if(e.touches.length===2){d0=dist(e.touches);z0=z;cx=(e.touches[0].clientX+e.touches[1].clientX)/2;}},{passive:true});
document.addEventListener('touchmove',function(e){
  if(e.touches.length===2&&d0){e.preventDefault();cx=(e.touches[0].clientX+e.touches[1].clientX)/2;setUser(z0*dist(e.touches)/d0,cx);}
},{passive:false});
document.addEventListener('touchend',function(e){if(e.touches.length<2)d0=0;},{passive:true});
/* open fitted on a phone; keep it fitted on rotate unless the person has zoomed by hand */
function init(){if(avail()<PAGE){z=0;set(fitZ());}else show();}
window.addEventListener('resize',function(){if(!user&&avail()<PAGE){z=0;set(fitZ());}});
if(document.readyState==='complete')setTimeout(init,50);else window.addEventListener('load',function(){setTimeout(init,50);});
})();
</script>
